<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Orders — Haxworks</title>
    <link rel="icon" href="/favicon.svg" />
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; background: #fff; color: #111; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      header { display: flex; justify-content: space-between; align-items: center; padding: 1.25rem 1.5rem; }
      header a { color: inherit; font-size: 0.875rem; font-weight: 800; letter-spacing: 0.18em; text-decoration: none; }
      main { width: min(64rem, 100%); margin: 0 auto; padding: 0 1.25rem 4rem; }
      h1 { margin: 0.4rem 0 0; font-size: 2rem; font-weight: 600; letter-spacing: -0.03em; }
      .tools { display: flex; gap: 0.5rem; }
      button, input, select { font: inherit; }
      button { border: 0; border-radius: 999px; background: #111; color: #fff; padding: 0.65rem 1rem; cursor: pointer; }
      button.ghost { background: #f4f4f4; color: #111; }
      button.mark-done, button.stage, button.undo { margin-left: 0; background: transparent; color: #111; padding: 0; font-size: 0.75rem; text-decoration: underline; border-radius: 0; }
      h2 { margin: 1.7rem 0 0.35rem; font-size: 1.05rem; font-weight: 600; }
      .list { margin: 0; padding: 0; list-style: none; }
      .list li { border-top: 1px solid #eee; padding: 0.65rem 0; font-size: 0.9rem; line-height: 1.4; }
      button.tiny, a.tiny { background: transparent; color: #111; padding: 0; margin-left: 0.45rem; text-decoration: underline; border-radius: 0; font-size: 0.8rem; }
      .stats.prod { grid-template-columns: repeat(3, 1fr); }
      .stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.6rem; margin-top: 1.25rem; }
      .stat { background: #f4f4f4; border-radius: 1rem; padding: 0.85rem 0.9rem; }
      .stat span { display: block; color: #5c5c5c; font-size: 0.75rem; }
      .stat strong { display: block; margin-top: 0.2rem; font-size: 1.15rem; }
      .sheet { width: 100%; margin-top: 0.6rem; border-collapse: collapse; font-size: 0.9rem; }
      .sheet th { text-align: left; color: #5c5c5c; font-size: 0.75rem; font-weight: 600; padding: 0.4rem; }
      .sheet th button.sort { background: transparent; color: #5c5c5c; padding: 0; border-radius: 0; font-size: 0.75rem; font-weight: 600; }
      .sheet th button.sort.on { color: #111; }
      .filters { display: flex; gap: 0.5rem; margin-top: 1rem; flex-wrap: wrap; }
      .filters input, .filters select { width: auto; margin: 0; flex: 1; min-width: 8rem; }
      .filters .ship { margin: 0; font-size: 0.75rem; color: #5c5c5c; min-width: 0; flex: none; }
      .filters .ship input { width: 4.2rem; min-width: 0; flex: none; }
      .sheet td { padding: 0.7rem 0.4rem; border-top: 1px solid #eee; vertical-align: top; }
      .sheet tr { cursor: pointer; }
      .pill { display: inline-block; border-radius: 999px; padding: 0.1rem 0.5rem; background: #f4f4f4; font-size: 0.75rem; }
      .pill.done { background: #eef6ef; }
      .note { color: #5c5c5c; }
      .tags { display: flex; flex-wrap: wrap; gap: 0.3rem; margin-top: 0.35rem; }
      .tag { display: inline-flex; align-items: center; gap: 0.25rem; border-radius: 0.4rem; padding: 0.12rem 0.5rem; font-size: 0.72rem; font-weight: 600; line-height: 1.3; border: 1.5px solid transparent; white-space: nowrap; }
      .tag.remote { background: #e8f0fe; color: #1a4fb4; border-color: #e8f0fe; border-radius: 999px; }
      .tag.local { background: #fff0e0; color: #a85400; border-color: #fff0e0; border-radius: 999px; }
      .tag.ship { color: #8a5a00; }
      .tag.arrive { color: #5b3fb0; }
      .tag.paint { color: #b0306a; }
      .tag.plan { background: #fff; border-style: dashed; }
      .tag.ship.plan { border-color: #e0b04a; }
      .tag.arrive.plan { border-color: #a58ee0; }
      .tag.paint.plan { border-color: #e48ab0; }
      .tag.ship.did { background: #fff3d6; border-color: #fff3d6; }
      .tag.arrive.did { background: #e6f7ec; color: #1c7a43; border-color: #e6f7ec; }
      .tag.paint.did { background: #fde7f1; border-color: #fde7f1; }
      .legend { font-size: 0.72rem; color: #5c5c5c; margin: 0.3rem 0 0.6rem; }
      .legend .tag { margin: 0 0.15rem; }
      .fig { display: flex; flex-wrap: wrap; align-items: center; gap: 0.4rem; margin-bottom: 0.4rem; }
      .fig-name { font-size: 0.75rem; color: #5c5c5c; }
      select.status, select.redo { width: auto; margin: 0; font-size: 0.8rem; font-weight: 600; border-radius: 999px; padding: 0.3rem 1.6rem 0.3rem 0.7rem; border: 1.5px solid transparent; cursor: pointer; }
      select.redo { width: 5.4rem; font-weight: 500; background-color: #fff; border-color: #ddd; color: #5c5c5c; padding: 0.25rem 1.4rem 0.25rem 0.55rem; font-size: 0.75rem; }
      select.status.s-pending { background-color: #f1f1f1; color: #555; }
      select.status.s-printing { background-color: #e3efff; color: #1a4fb4; }
      select.status.s-toship { background-color: #fff3d6; color: #8a5a00; }
      select.status.s-shipping { background-color: #ffe6cc; color: #a85400; }
      select.status.s-arrived { background-color: #efe7ff; color: #5b3fb0; }
      select.status.s-paintready { background-color: #fde7f1; color: #b0306a; }
      select.status.s-painting { background-color: #fde0ee; color: #a3195b; }
      select.status.s-done { background-color: #e1f5e9; color: #1c7a43; }
      .rework-tag { background: #ffe3e3; color: #b3261e; border-color: #ffe3e3; }
      dialog { width: min(32rem, calc(100% - 2rem)); border: 0; border-radius: 1.25rem; padding: 1.25rem; }
      dialog::backdrop { background: rgba(0, 0, 0, 0.35); }
      label { display: block; margin-top: 0.75rem; font-size: 0.8rem; font-weight: 600; }
      input, select { width: 100%; margin-top: 0.25rem; border: 1px solid #e6e6e6; border-radius: 0.8rem; padding: 0.65rem 0.75rem; }
      .row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.7rem; }
      .cal-head { display: flex; justify-content: space-between; align-items: center; }
      .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 0.3rem; margin-top: 0.8rem; }
      .dow, .day { text-align: center; font-size: 0.75rem; }
      .dow { color: #5c5c5c; padding-bottom: 0.2rem; }
      .day { min-height: 3.4rem; border: 0; border-radius: 0.7rem; background: #f7f7f7; color: #111; padding: 0.3rem; }
      .day small { display: block; color: #5c5c5c; font-size: 0.62rem; }
      .day.has { box-shadow: inset 0 -2px 0 #111; }
      .day.full { background: #f8ecec; }
      .day.off { background: transparent; color: #bbb; }
      .day.on { outline: 2px solid #111; }
      #day-detail { margin-top: 0.9rem; font-size: 0.9rem; line-height: 1.45; }
      .wrap { overflow-x: auto; }
      .ask { position: fixed; right: 1.1rem; bottom: 1.1rem; width: 3.1rem; height: 3.1rem; border-radius: 999px; display: grid; place-items: center; z-index: 4; padding: 0; }
      .ask svg { width: 1.35rem; height: 1.35rem; }
      #chat { width: min(24rem, calc(100% - 1.5rem)); height: min(34rem, calc(100% - 2rem)); padding: 0; }
      #chat[open] { display: flex; flex-direction: column; }
      .chat-head { display: flex; justify-content: space-between; align-items: center; padding: 0.9rem 1rem; border-bottom: 1px solid #eee; }
      #chat-log { flex: 1; overflow: auto; padding: 1rem; display: flex; flex-direction: column; gap: 0.6rem; }
      .bubble { max-width: 85%; border-radius: 1rem; padding: 0.65rem 0.8rem; font-size: 0.9rem; line-height: 1.45; }
      .bubble.user { align-self: flex-end; background: #111; color: #fff; }
      .bubble.assistant { align-self: flex-start; background: #f4f4f4; }
      #chat-form { display: flex; gap: 0.4rem; padding: 0.8rem; border-top: 1px solid #eee; }
      #chat-form input { margin: 0; }
      #chat-form button { margin: 0; }
      @media (max-width: 800px) {
        .stats { grid-template-columns: 1fr 1fr; }
        header { align-items: flex-start; gap: 0.8rem; }
      }
    </style>
  </head>
  <body>
    <header>
      <a href="/">HAXWORKS</a>
      <div class="tools">
        <span id="sync-state" class="note" style="font-size:0.75rem"></span>
        <button class="ghost" id="open-cal" type="button">Calendar</button>
        <button id="open-add" type="button">Add order</button>
      </div>
    </header>
    <main>
      <p class="note">Only for you</p>
      <h1>Orders</h1>
      <div class="stats" id="stats"></div>
      <p class="note" id="undated"></p>
      <div class="filters">
        <input id="filter-q" type="search" placeholder="Search name or note" />
        <select id="filter-size">
          <option value="">All sizes</option>
          <option>Standard 4"</option>
          <option>Super 6"</option>
          <option>Jumbo 10"</option>
        </select>
        <select id="filter-status">
          <option value="">All orders</option>
          <option value="@open">Not completed (in progress)</option>
          <option value="@done">Completed (delivered)</option>
          <optgroup label="By step">
            <option value="Designing">✏️ Designing</option>
            <option value="Printing">🖨️ Printing</option>
            <option value="Painting">🎨 Painting</option>
            <option value="Shipping">🚚 Shipping</option>
            <option value="On Hold">⏸️ On hold</option>
            <option value="Cancelled">✖ Cancelled</option>
          </optgroup>
        </select>
        <label class="ship">Ship days <input id="ship-days" type="number" min="0" value="1" /></label>
      </div>
      <div class="wrap">
        <table class="sheet">
          <thead>
            <tr>
              <th><button class="sort" type="button" data-sort="name" data-label="Name">Name</button></th>
              <th><button class="sort" type="button" data-sort="size" data-label="Size">Size</button></th>
              <th><button class="sort" type="button" data-sort="qty" data-label="Qty">Qty</button></th>
              <th><button class="sort" type="button" data-sort="due" data-label="Due">Due</button></th>
              <th><button class="sort" type="button" data-sort="paid" data-label="Paid">Paid</button></th>
              <th><button class="sort" type="button" data-sort="balance" data-label="Balance">Balance</button></th>
              <th><button class="sort" type="button" data-sort="status" data-label="Status">Status</button></th>
              <th>Note</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <h2>Today</h2>
      <ul class="list" id="tasks"></ul>
      <h2>Needs a look <span class="note" style="font-weight:400;font-size:0.8rem">· next 2 weeks</span></h2>
      <ul class="list" id="risks"></ul>
      <h2>Money</h2>
      <div class="filters">
        <button class="ghost" type="button" data-range="all">All</button>
        <button class="ghost" type="button" data-range="today">Today</button>
        <button class="ghost" type="button" data-range="week">This week</button>
        <button class="ghost" type="button" data-range="month">This month</button>
        <input id="money-from" type="date" />
        <input id="money-to" type="date" />
      </div>
      <div class="stats" id="money-stats"></div>
      <p class="note" id="money-breakdown"></p>
      <h2>Closures</h2>
      <div class="filters">
        <input id="close-date" type="date" />
        <select id="close-type">
          <option value="print">Printer maintenance</option>
          <option value="paint">Painter off</option>
          <option value="shop">Shop closed</option>
        </select>
        <button class="ghost" id="add-close" type="button">Add</button>
        <label class="ship">Print points <input id="print-points" type="number" min="0.5" step="0.5" value="2" /></label>
        <label class="ship">Paint points <input id="paint-points" type="number" min="0.5" step="0.5" value="3" /></label>
        <label class="ship">Return days <input id="return-days" type="number" min="0" value="1" /></label>
      </div>
      <ul class="list" id="closures"></ul>
      <h2>Production summary</h2>
      <div class="stats prod" id="production"></div>
    </main>

    <dialog id="editor">
      <form id="order-form">
        <strong id="form-title">Add order</strong>
        <label>Name <input name="name" required /></label>
        <div class="row">
          <label>Size
            <select name="size">
              <option>Standard 4"</option>
              <option>Super 6"</option>
              <option>Jumbo 10"</option>
            </select>
          </label>
          <label>Qty <input name="qty" type="number" min="1" value="1" required /></label>
        </div>
        <div class="row">
          <label>Due date <input name="due" type="date" /></label>
          <label>Approved rush, days off the lead time <input name="rushDays" type="number" min="0" value="0" /></label>
        </div>
        <div class="row">
          <label>Selling price <input name="price" type="number" min="0" step="0.01" /></label>
          <label>Material <input name="material" type="number" min="0" step="0.01" /></label>
        </div>
        <div class="row">
          <label>Paint labor <input name="labor" type="number" min="0" step="0.01" /></label>
          <label>Other cost <input name="other" type="number" min="0" step="0.01" /></label>
        </div>
        <div class="row">
          <label>Amount paid <input name="paid" type="number" min="0" step="0.01" value="0" /></label>
          <label>Balance <input name="balance" type="number" min="0" step="0.01" value="0" /></label>
        </div>
        <div class="row">
          <label>Painter
            <select name="painter">
              <option value="remote">Remote regular</option>
              <option value="local">Local rush</option>
            </select>
          </label>
          <label>Payment
            <select name="status">
              <option>Pending</option>
              <option>Completed</option>
              <option>Refunded</option>
            </select>
          </label>
          <label>Note <input name="note" /></label>
        </div>
        <div id="figure-stages"></div>
        <div class="tools" style="margin-top: 1rem;">
          <button type="submit">Save</button>
          <button class="ghost" type="button" id="close-editor">Cancel</button>
          <button class="warn" type="button" id="delete-order" hidden>Delete</button>
        </div>
      </form>
    </dialog>

    <dialog id="calendar">
      <div class="cal-head">
        <button class="ghost" id="prev-month" type="button">Back</button>
        <strong id="month-label"></strong>
        <button class="ghost" id="next-month" type="button">Next</button>
      </div>
      <div class="grid" id="cal-grid"></div>
      <div id="day-detail" class="note">Pick a date. Open or Full on the calendar is for one 4-inch.</div>
      <button class="ghost" id="export-cal" type="button" style="margin-top: 0.8rem;">Download calendar image</button>
      <button class="ghost" id="close-cal" type="button" style="margin-top: 0.8rem;">Close</button>
    </dialog>

    <button class="ask" id="open-chat" type="button" aria-label="Ask the shop">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 6.5h14v9H8l-3 2.5v-2.5H5v-9Z"/></svg>
    </button>
    <dialog id="chat">
      <div class="chat-head">
        <strong>Shop desk</strong>
        <button class="ghost" id="close-chat" type="button">Close</button>
      </div>
      <div id="chat-log"></div>
      <form id="chat-form">
        <input name="text" placeholder="Ask about a date or a size" autocomplete="off" />
        <button type="submit">Send</button>
      </form>
    </dialog>

    <script type="module">
      import { acceptOrder, dayActivity, earliestDate, formatDay, hoursFor, optimizeProductionSchedule, painterOf, parseSize, schedule, startOfDay } from "./logic.js";

      const HOURS = 8;
      const WORKDAYS = [1, 2, 3, 4, 5];
      const money = new Intl.NumberFormat("en-PH", { style: "currency", currency: "PHP" });
      const SEED = [];

      let sortKey = "due";
      let sortDir = 1;

      function sortValue(order, key) {
        if (key === "name") return String(order.name || "").toLowerCase();
        if (key === "status") return orderStage(order).toLowerCase();
        if (key === "size") return parseSize(order.size) || 0;
        if (key === "qty" || key === "paid" || key === "balance") return Number(order[key]) || 0;
        if (key === "due") return order.due || "9999-99-99";
        return "";
      }
      function visibleOrders() {
        const query = document.querySelector("#filter-q").value.trim().toLowerCase();
        const size = document.querySelector("#filter-size").value;
        const status = document.querySelector("#filter-status").value;
        return orders
          .filter((order) => {
            if (size && order.size !== size) return false;
            if (status === "@open") { if (["Completed", "Cancelled"].includes(group(orderStage(order)))) return false; }
            else if (status === "@done") { if (group(orderStage(order)) !== "Completed") return false; }
            else if (status && group(orderStage(order)) !== status) return false;
            if (query && !`${order.name} ${order.note || ""}`.toLowerCase().includes(query)) return false;
            return true;
          })
          .sort((a, b) => {
            const left = sortValue(a, sortKey);
            const right = sortValue(b, sortKey);
            if (left < right) return -sortDir;
            if (left > right) return sortDir;
            return String(a.name).localeCompare(String(b.name));
          });
      }
      let editing = null;
      let shown = startOfDay(new Date());
      let selected = null;

      function load() {
        try {
          const saved = JSON.parse(localStorage.getItem("hax-orders") || "null");
          if (Array.isArray(saved) && saved.length) return saved;
        } catch {}
        return SEED;
      }
      let orders = load().map(withFigures);
      save();
      function save() {
        localStorage.setItem("hax-orders", JSON.stringify(orders));
      }
      function done(status) {
        return ["completed", "done", "shipped", "cancelled", "canceled"].includes(String(status || "").trim().toLowerCase());
      }
      function withFigures(order) {
        const qty = Number(order.qty) || 1;
        const existing = Array.isArray(order.figures) ? order.figures : [];
        const figures = [];
        for (let index = 0; index < qty; index += 1) {
          const current = existing[index];
          figures.push(current && current.stage
            ? { stage: "Pending", printStarted: "", printFinished: "", shipOut: "", expectedArrival: "", actualArrival: "", paintStarted: "", paintFinished: "", ...current }
            : { stage: done(order.status) ? "Completed" : "Pending", printStarted: "", printFinished: "", shipOut: "", expectedArrival: "", actualArrival: "", paintStarted: "", paintFinished: "" });
        }
        return { ...order, painter: painterOf(order), figures };
      }
      function orderStage(order) {
        const stages = withFigures(order).figures.map((figure) => figure.stage);
        if (stages.every((stage) => stage === "Completed")) return "Completed";
        if (stages.some((stage) => stage === "Painting")) return "Painting";
        if (stages.some((stage) => stage === "Received")) return "Received";
        if (stages.some((stage) => stage === "Shipped")) return "Shipped";
        if (stages.some((stage) => stage === "Ready for Ship-out")) return "Ready for Ship-out";
        if (stages.some((stage) => stage === "Ready for Painting")) return "Ready for Painting";
        if (stages.some((stage) => stage === "Printing")) return "Printing";
        if (stages.some((stage) => stage === "Shipping")) return "Shipping";
        if (stages.some((stage) => stage === "On Hold")) return "On Hold";
        if (stages.every((stage) => stage === "Cancelled")) return "Cancelled";
        return "Pending";
      }
      // Simple 5-step view of the detailed internal stages.
      function group(stage) {
        if (stage === "Pending") return "Designing";
        if (["Ready for Ship-out", "Shipped", "Received", "Ready for Painting", "Painting"].includes(stage)) return "Painting";
        return stage;
      }
      function nowStamp() {
        const date = new Date();
        const pad = (value) => String(value).padStart(2, "0");
        return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}`;
      }
      function moveFigure(figure, stage) {
        const next = { ...figure, stage };
        const now = nowStamp();
        if (stage === "Pending") return { ...next, printStarted: "", printFinished: "", paintStarted: "", paintFinished: "" };
        if (stage === "Printing") return { ...next, printStarted: figure.printStarted || now, printFinished: "" };
        if (stage === "Ready for Ship-out") return { ...next, printFinished: figure.stage === "Shipped" ? "" : (figure.printFinished || now), shipOut: "", expectedArrival: "", actualArrival: "" };
        if (stage === "Shipped") {
          const shipOut = figure.shipOut || now;
          const base = parseISO(String(shipOut).slice(0, 10)) || new Date();
          const arrival = new Date(base.getFullYear(), base.getMonth(), base.getDate() + shipDays());
          return { ...next, printFinished: figure.printFinished || now, shipOut, expectedArrival: figure.expectedArrival || iso(arrival), actualArrival: "" };
        }
        if (stage === "Received") {
          if (figure.stage === "Painting") return { ...next, paintStarted: "", actualArrival: figure.actualArrival };
          return { ...next, actualArrival: now };
        }
        if (stage === "Ready for Painting") return { ...next, printStarted: figure.printStarted || now, printFinished: figure.stage === "Painting" ? "" : (figure.printFinished || now), paintStarted: "" };
        if (stage === "Painting") return { ...next, paintStarted: figure.stage === "Completed" ? figure.paintStarted : figure.paintStarted || now, paintFinished: "" };
        if (stage === "Shipping") return { ...next, printFinished: figure.printFinished || now, paintFinished: figure.paintFinished || now };
        if (stage === "Completed") return { ...next, paintFinished: figure.paintFinished || now };
        return next;
      }
      function reworkFigure(figure, kind, painter) {
        const history = [...(figure.history || []), { stage: figure.stage, printStarted: figure.printStarted, printFinished: figure.printFinished, paintStarted: figure.paintStarted, paintFinished: figure.paintFinished, shipOut: figure.shipOut, at: nowStamp() }];
        if (kind === "reprint") {
          return { ...figure, history, stage: "Pending", rework: "Reprint required", printStarted: "", printFinished: "", shipOut: "", expectedArrival: "", actualArrival: "", paintStarted: "", paintFinished: "" };
        }
        return { ...figure, history, stage: painter === "remote" && figure.actualArrival ? "Received" : "Ready for Painting", rework: "Repaint required", paintStarted: "", paintFinished: "" };
      }
      function settle(order) {
        return { ...order, status: "Completed", paid: Number(order.paid || 0) + Number(order.balance || 0), balance: 0 };
      }
      function parseISO(value) {
        if (!value) return null;
        const [year, month, day] = String(value).split("-").map(Number);
        if (!year || !month || !day) return null;
        return new Date(year, month - 1, day);
      }

          for (let c = 0; c < 7; c += 1) {
            const day = r * 7 + c - offset + 1;
            if (day >= 1 && day <= days) most = Math.max(most, (byDay.get(day) || []).reduce((sum, order) => sum + pillsFor(order).length, 0));
          }
          rowH.push(Math.max(250, numH + most * (pillH + gap) + 24));
        }
        const H = titleH + dowH + rowH.reduce((a, b) => a + b, 0);
        const canvas = document.createElement("canvas");
        canvas.width = W;
        canvas.height = H;
        const g = canvas.getContext("2d");
        g.fillStyle = "#fff";
        g.fillRect(0, 0, W, H);
        const serif = '"Playfair Display","Bodoni MT","Didot","Bodoni 72",Georgia,"Times New Roman",serif';
        const sans = '"Poppins","Segoe UI",system-ui,-apple-system,Arial,sans-serif';
        g.textBaseline = "alphabetic";
        g.fillStyle = "#4d4d4d";
        g.font = `700 430px ${serif}`;
        g.textAlign = "left";
        g.fillText(new Date(year, month, 1).toLocaleDateString("en-US", { month: "long" }), 48, titleH - 55);
        g.font = `400 110px ${serif}`;
        g.textAlign = "right";
        g.letterSpacing = "14px";
        g.fillText(String(year), W - 48 + 14, titleH - 62);
        g.letterSpacing = "0px";
        const line = (x1, y1, x2, y2, w, color) => { g.strokeStyle = color; g.lineWidth = w; g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke(); };
        line(0, titleH - 4, W, titleH - 4, 5, "#2b2b2b");
        const colW = W / 7;
        g.textAlign = "center";
        g.fillStyle = "#555";
        g.font = `400 46px ${sans}`;
        ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"].forEach((label, c) => g.fillText(label, colW * c + colW / 2, titleH + 66));
        line(0, titleH + dowH, W, titleH + dowH, 4, "#2b2b2b");
        let y = titleH + dowH;
        for (let r = 0; r < rowsCount; r += 1) {
          for (let c = 0; c < 7; c += 1) {
            const day = r * 7 + c - offset + 1;
            const x = colW * c;
            if (c > 0) line(x, y, x, y + rowH[r], 2, "#8c8c8c");
            if (day < 1 || day > days) continue;
            g.fillStyle = "#444";
            g.font = `400 52px ${sans}`;
            g.textAlign = "center";
            g.fillText(String(day), x + colW / 2, y + 62);
            let py = y + numH;
            for (const order of byDay.get(day) || []) {
              for (const pill of pillsFor(order)) {
                let size = 30;
                g.font = `600 ${size}px ${sans}`;
                while (g.measureText(pill.text).width > colW - 56 && size > 14) { size -= 1; g.font = `600 ${size}px ${sans}`; }
                const w = Math.min(colW - 24, g.measureText(pill.text).width + 44);
                g.fillStyle = pill.color;
                g.beginPath();
                g.roundRect(x + (colW - w) / 2, py, w, pillH, pillH / 2);
                g.fill();
                g.fillStyle = "#111";
                g.textBaseline = "middle";
                g.fillText(pill.text, x + colW / 2, py + pillH / 2 + 2);
                g.textBaseline = "alphabetic";
                py += pillH + gap;
              }
            }
          }
          y += rowH[r];
          line(0, y, W, y, 2, "#8c8c8c");
        }
        canvas.toBlob((blob) => {
          const link = document.createElement("a");
          link.href = URL.createObjectURL(blob);
          link.download = `haxworks-${new Date(year, month, 1).toLocaleDateString("en-US", { month: "long" }).toLowerCase()}-${year}.png`;
          document.body.appendChild(link);
          link.click();
          link.remove();
          setTimeout(() => URL.revokeObjectURL(link.href), 4000);
        }, "image/png");
      }
      document.querySelector("#export-cal").onclick = exportCalendar;
      document.querySelector("#prev-month").onclick = () => {
        shown = new Date(shown.getFullYear(), shown.getMonth() - 1, 1);
        drawCalendar();
      };
      document.querySelector("#next-month").onclick = () => {
        shown = new Date(shown.getFullYear(), shown.getMonth() + 1, 1);
        drawCalendar();
      };

      function drawCalendar() {
        const year = shown.getFullYear();
        const month = shown.getMonth();
        document.querySelector("#month-label").textContent = shown.toLocaleDateString("en-US", { month: "long", year: "numeric" });
        const dueMap = new Map();
        for (const order of orders) {
          if (!order.due || done(order.status)) continue;
          const list = dueMap.get(order.due) || [];
          list.push(order);
          dueMap.set(order.due, list);
        }
        const first = new Date(year, month, 1);
        const startPad = first.getDay();
        const days = new Date(year, month + 1, 0).getDate();
        const cells = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].map((label) => `<div class="dow">${label}</div>`);
        for (let i = 0; i < startPad; i += 1) cells.push("<div></div>");
        const todayKey = iso(startOfDay(new Date()));
        for (let day = 1; day <= days; day += 1) {
          const date = new Date(year, month, day);
          const key = iso(date);
          const past = key < todayKey;
          const has = dueMap.has(key);
          let mark = "";
          let full = false;
          if (!past) {
            const result = acceptOrder(capacityOrders(), { size: 4, qty: 1, deadline: date, rushDays: 0 }, shop());
            full = !result.ok;
            mark = full ? "Full" : "Open";
          }
          cells.push(`<button class="day ${has ? "has" : ""} ${full ? "full" : ""} ${selected === key ? "on" : ""}" data-date="${key}" type="button">${day}<small>${mark}</small></button>`);
        }
        const grid = document.querySelector("#cal-grid");
        grid.innerHTML = cells.join("");
        grid.onclick = (event) => {
          const button = event.target.closest("[data-date]");
          if (!button) return;
          selected = button.dataset.date;
          drawCalendar();
        };
        showDay();
      }

      function showDay() {
        const box = document.querySelector("#day-detail");
        if (!selected) return;
        const date = parseISO(selected);
        const due = orders.filter((order) => order.due === selected && !done(order.status));
        const names = due.length ? due.map((order) => `${order.name} · ${order.qty} × ${order.size}`).join("<br>") : "No deadline on this day.";
        const settings = shop();
        const fits = [4, 6, 10].map((size) => {
          const result = acceptOrder(capacityOrders(), { size, qty: 1, deadline: date, rushDays: 0 }, settings);
          return `${size}" ${result.ok ? "fits" : "does not fit"}`;
        });
        const localFits = [4, 6, 10].map((size) => {
          const result = acceptOrder(capacityOrders(), { size, qty: 1, deadline: date, rushDays: 0, painter: "local" }, settings);
          return `${size}" ${result.ok ? "fits" : "does not fit"}`;
        });
        const activity = dayActivity(capacityOrders(), settings, date);
        const namesFor = (list) => (list.length ? [...new Set(list.map((figure) => figure.name))].join(", ") : "None");
        const bench = `Print ${activity.printUsed} of ${activity.printCap}${activity.paintCap ? ` · Paint ${activity.paintUsed} of ${activity.paintCap}` : " · No painting this day"}`;
        box.innerHTML = `<strong>${formatDay(date)}</strong><br>${names}<br><span class="note">Regular, with shipping: ${fits.join(" · ")}.<br>Local rush, no shipping: ${localFits.join(" · ")}.<br>Printing: ${namesFor(activity.printing)}<br>Painting: ${namesFor(activity.painting)}<br>${bench}. Paint points stay at 3 for both painters together.</span>`;
      }

      const chatLog = [];
      const chatBox = document.querySelector("#chat");
      const chatList = document.querySelector("#chat-log");

      function monthEnd() {
        const today = startOfDay(new Date());
        return new Date(today.getFullYear(), today.getMonth() + 1, 0);
      }

      function howMany(size, deadline) {
        const open = capacityOrders();
        const settings = shop();
        let count = 0;
        for (let qty = 1; qty <= 20; qty += 1) {
          if (!acceptOrder(open, { size, qty, deadline, rushDays: 0 }, settings).ok) break;
          count = qty;
        }
        return count;
      }

      function verdict(question) {
        const lower = String(question || "").toLowerCase();
        const size = /jumbo|\b10\b/.test(lower) ? 10 : /super|\b6\b/.test(lower) ? 6 : /standard|\b4\b/.test(lower) ? 4 : null;
        const names = ["january", "february", "march", "april", "may", "june", "july", "august", "september", "october", "november", "december"];
        let date = null;
        const exact = lower.match(/(\d{4})-(\d{2})-(\d{2})/);
        if (exact) date = new Date(Number(exact[1]), Number(exact[2]) - 1, Number(exact[3]));
        else {
          names.forEach((name, index) => {
            const found = lower.match(new RegExp(name.slice(0, 3) + "\\w*\\s+(\\d{1,2})"));
            if (found) date = new Date(new Date().getFullYear(), index, Number(found[1]));
          });
        }
        if (!size || !date) return "";
        const rush = lower.match(/(\d+)\s*day/);
        const result = acceptOrder(capacityOrders(), { size, qty: 1, deadline: date, rushDays: rush ? Number(rush[1]) : 0 }, shop());
        const soon = earliestDate(capacityOrders(), { size, qty: 1 }, shop());
        return `Checked one ${size}-inch for ${formatDay(result.promised)}: ${result.ok ? "Yes, it finishes " + formatDay(result.finish) : "No. Earliest open day is " + (soon ? formatDay(soon) : "unknown")}.`;
      }

      function shopFacts(question) {
        const settings = shop();
        const end = monthEnd();
        const catalog = orders
          .map((order) => `id ${order.id}: ${order.name}, ${order.qty} x ${order.size}, ${painterOf(order) === "local" ? "local rush" : "remote regular"}, due ${order.due || "none"}, stage ${orderStage(order)}, figures ${withFigures(order).figures.map((figure) => figure.stage).join("/")}, rush ${order.rushDays || 0}, paid ${order.paid || 0}, balance ${order.balance || 0}, payment ${order.status || "Pending"}${order.note ? `, note ${order.note}` : ""}`)
          .join("; ");
        const rows = schedule(capacityOrders(), settings);
        const lines = rows.map((order) => {
          const source = orders.find((item) => item.id === order.id);
          const name = source ? source.name : "Order";
          return `${name}: ${source ? source.qty : 1} x ${source ? source.size : "figure"}, due ${order.promised ? formatDay(order.promised) : "none"}, finishes ${order.finish ? formatDay(order.finish) : "not placed"}, ${order.stage || "Pending"}, ${order.ok ? "on time" : "at risk"}`;
        });
        const undated = orders
          .filter((order) => !done(order.status) && !order.due)
          .map((order) => `${order.name}: ${order.qty} x ${order.size}, unscheduled, no printer or paint day`);
        const room = [4, 6, 10]
          .map((size) => {
            const date = earliestDate(capacityOrders(), { size, qty: 1 }, settings);
            return `one ${size}-inch earliest ${date ? formatDay(date) : "unknown"}, ${howMany(size, end)} more fit by ${formatDay(end)}`;
          })
          .join(". ");
        return [
          `Today is ${formatDay(settings.today)}. Shipping to the remote painter takes ${settings.shipDays} day. Regular orders use that painter: print, then ship the next day, then paint on a weekday after arrival. Rush orders use the local painter and do not ship. Both painters share one paint bench of 3 points a day. Do not add those together. The calendar mark is a regular 4-inch, including shipping. The printer runs every day: two 4-inch figures, or one 6-inch. A 10-inch keeps the printer for 4 calendar days in a row. A normal 4-inch or 6-inch needs 3 days of lead time. A 10-inch needs 7. Rush only shortens that lead time. Use the Checked line if it is present.`,
          `Sheet: ${catalog}.`,
          lines.length ? `Open dated orders: ${lines.join("; ")}.` : "No dated pending orders.",
          undated.length ? `No deadline yet: ${undated.join("; ")}. These are not in the calendar.` : "Every pending order has a deadline.",
          `Room: ${room}.`,
          verdict(question),
        ].filter(Boolean).join("\n");
      }

      function paintChat() {
        chatList.innerHTML = chatLog
          .map((message) => `<div class="bubble ${message.role}">${escapeHtml(message.text)}</div>`)
          .join("");
        chatList.scrollTop = chatList.scrollHeight;
      }

      function ownerAskedToChange(text) {
        return /\b(add|create|book|change|move|set|update|edit|complete|delete|remove|cancel|schedule|go ahead|do it|do that)\b/i.test(text);
      }
      function sizeName(value) {
        const size = parseSize(value);
        if (size === 10) return 'Jumbo 10"';
        if (size === 6) return 'Super 6"';
        if (size === 4) return 'Standard 4"';
        return "";
      }
      function applyDeskChanges(changes) {
        const notes = [];
        for (const change of changes) {
          const op = String(change.op || "").toLowerCase();
          if (op === "add") {
            const size = sizeName(change.size);
            const name = String(change.name || "").trim();
            if (!name || !size) {
              notes.push("I skipped an add because the name or size was not clear.");
              continue;
            }
            orders.push({
              id: crypto.randomUUID(),
              name,
              size,
              qty: Math.max(1, Number(change.qty) || 1),
              due: /^\d{4}-\d{2}-\d{2}$/.test(change.due || "") ? change.due : "",
              rushDays: Math.max(0, Number(change.rushDays) || 0),
              paid: Number(change.paid) || 0,
              balance: Number(change.balance) || 0,
              status: "Pending",
              note: String(change.note || ""),
            });
            notes.push(`Added ${name}.`);
          } else if (op === "update" || op === "complete" || op === "delete") {
            const index = orders.findIndex((order) => order.id === String(change.id || ""));
            if (index < 0) {
              notes.push("I could not find that order.");
              continue;
            }
            if (op === "delete") {
              notes.push(`Removed ${orders[index].name}.`);
              orders.splice(index, 1);
              continue;
            }
            if (op === "complete") {
              orders[index] = settle(orders[index]);
              notes.push(`Marked ${orders[index].name} completed.`);
              continue;
            }
            const next = { ...orders[index] };
            if (change.name) next.name = String(change.name);
            if (change.size && sizeName(change.size)) next.size = sizeName(change.size);
            if (change.qty != null) next.qty = Math.max(1, Number(change.qty) || 1);
            if (change.due === "") next.due = "";
            else if (/^\d{4}-\d{2}-\d{2}$/.test(change.due || "")) next.due = change.due;
            if (change.rushDays != null) next.rushDays = Math.max(0, Number(change.rushDays) || 0);
            if (change.paid != null) next.paid = Number(change.paid) || 0;
            if (change.balance != null) next.balance = Number(change.balance) || 0;
            if (change.status) next.status = String(change.status);
            if (change.note != null) next.note = String(change.note);
            orders[index] = next;
            notes.push(`Updated ${next.name}.`);
          }
        }
        if (notes.length) {
          save();
          render();
          drawCalendar();
        }
        return notes;
      }

      async function ask(text) {
        chatLog.push({ role: "user", text });
        paintChat();
        const pending = { role: "assistant", text: "Checking the bench…" };
        chatLog.push(pending);
        paintChat();
        try {
          const response = await fetch("/api/desk", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ brief: shopFacts(text), messages: chatLog.filter((message) => message !== pending) }),
          });
          const data = await response.json();
          const notes = ownerAskedToChange(text) && Array.isArray(data.changes) ? applyDeskChanges(data.changes) : [];
          pending.text = [data.reply || data.error || "No answer.", notes.length ? notes.join(" ") : ""].filter(Boolean).join(" ");
        } catch {
          pending.text = "I could not reach the desk.";
        }
        paintChat();
      }

      document.querySelector("#open-chat").onclick = () => {
        chatBox.showModal();
        if (!chatLog.length) ask("How many orders can I still take this month?");
      };
      document.querySelector("#close-chat").onclick = () => chatBox.close();
      document.querySelector("#chat-form").onsubmit = (event) => {
        event.preventDefault();
        const input = event.target.elements.text;
        const text = input.value.trim();
        if (!text) return;
        input.value = "";
        ask(text);
      };

      document.querySelector("#print-points").value = String(storedNumber("hax-print-points", 2));
      document.querySelector("#paint-points").value = String(storedNumber("hax-paint-points", 3));
      document.querySelector("#return-days").value = localStorage.getItem("hax-return-days") || "1";
      function saveCapacity() {
        localStorage.setItem("hax-print-points", document.querySelector("#print-points").value);
        localStorage.setItem("hax-paint-points", document.querySelector("#paint-points").value);
        localStorage.setItem("hax-return-days", document.querySelector("#return-days").value);
        render();
        drawCalendar();
      }
      document.querySelector("#print-points").onchange = saveCapacity;
      document.querySelector("#paint-points").onchange = saveCapacity;
      document.querySelector("#return-days").onchange = saveCapacity;
      document.querySelector("#add-close").onclick = () => {
        const date = document.querySelector("#close-date").value;
        if (!date) return;
        closures.push({ date, type: document.querySelector("#close-type").value });
        saveExtra();
        render();
        drawCalendar();
      };
      document.querySelector("main").onclick = (event) => {
        const range = event.target.closest("[data-range]");
        if (range) {
          moneyRange = range.dataset.range;
          document.querySelector("#money-from").value = "";
          document.querySelector("#money-to").value = "";
          render();
          return;
        }
        const close = event.target.closest("[data-close]");
        if (close) {
          closures.splice(Number(close.dataset.close), 1);
          saveExtra();
          render();
          drawCalendar();
          return;
        }
        const task = event.target.closest("[data-task]");
        if (task?.dataset.task) {
          const order = orders.find((item) => item.id === task.dataset.order);
          const figure = order ? withFigures(order).figures[Number(task.dataset.figure)] : null;
          const remote = order && painterOf(order) === "remote";
          const next = { Pending: "Printing", Printing: remote ? "Ready for Ship-out" : "Ready for Painting", "Ready for Ship-out": "Shipped", Shipped: "Received", Received: "Painting", "Ready for Painting": "Painting", Painting: "Shipping", Shipping: "Completed" }[figure?.stage];
          if (figure && next === task.dataset.task) {
            setFigureStage(order.id, Number(task.dataset.figure), next);
            save();
            render();
            drawCalendar();
          }
          return;
        }
        if (event.target.id === "make-shipment") {
          const picked = [...document.querySelectorAll("[data-pack]:checked")].map((box) => box.dataset.pack);
          if (!picked.length) return;
          shipments.unshift({
            id: `S${String(Date.now()).slice(-6)}`,
            status: "Preparing",
            courier: "",
            tracking: "",
            cost: "",
            returnCost: "",
            shipOut: "",
            expectedArrival: "",
            actualArrival: "",
            returnShip: "",
            returnArrival: "",
            figures: picked.map((key) => {
              const [orderId, index] = key.split(":");
              const order = orders.find((item) => item.id === orderId);
              return { key, orderId, index: Number(index), name: order?.name || "Order" };
            }),
          });
          saveExtra();
          render();
          return;
        }
        const action = event.target.closest("[data-ship-do]");
        if (!action) return;
        const shipment = shipments.find((item) => item.id === action.dataset.id);
        if (!shipment) return;
        const need = { Shipped: ["Ready for Ship-out"], Received: ["Shipped"], Painting: ["Received", "Ready for Painting"], Completed: ["Painting"] }[action.dataset.shipDo];
        if (need) {
          const ready = shipment.figures.every((item) => {
            const order = orders.find((entry) => entry.id === item.orderId);
            return order && need.includes(withFigures(order).figures[item.index]?.stage);
          });
          if (!ready) return;
          const stage = action.dataset.shipDo === "Completed" ? "Shipping" : action.dataset.shipDo;
          for (const item of shipment.figures) setFigureStage(item.orderId, item.index, stage);
          shipment.status = action.dataset.shipDo === "Completed" ? "Painting Complete" : action.dataset.shipDo;
          if (action.dataset.shipDo === "Shipped") {
            shipment.shipOut = iso(new Date());
            const arrival = new Date();
            arrival.setDate(arrival.getDate() + shipDays());
            shipment.expectedArrival = iso(arrival);
          }
          if (action.dataset.shipDo === "Received") shipment.actualArrival = iso(new Date());
          save();
        }
        if (action.dataset.shipDo === "Return") {
          shipment.status = "Return Shipment";
          shipment.returnShip = iso(new Date());
        }
        if (action.dataset.shipDo === "Back") {
          shipment.status = "Received Back";
          shipment.returnArrival = iso(new Date());
        }
        saveExtra();
        render();
        drawCalendar();
      };
      document.querySelector("main").onchange = (event) => {
        const field = event.target.closest("[data-field]");
        if (field?.dataset.ship) {
          const shipment = shipments.find((item) => item.id === field.dataset.ship);
          if (!shipment) return;
          shipment[field.dataset.field] = field.dataset.field === "cost" || field.dataset.field === "returnCost" ? Number(field.value) || 0 : field.value;
          saveExtra();
          render();
          return;
        }
        if (event.target.id === "money-from" || event.target.id === "money-to") {
          moneyRange = "custom";
          render();
        }
      };

      render();

      // ---- Shared storage: every hax-* setting/order is mirrored to the server so all devices match. ----
      (() => {
        const PREFIX = "hax-";
        const FLAG = "hax-synced";
        const nativeSet = Storage.prototype.setItem;
        const nativeRemove = Storage.prototype.removeItem;
        const label = document.querySelector("#sync-state");
        const show = (text) => { label.textContent = text; };
        let version = 0;
        let ready = false;
        let busy = false;
        let dirty = false;
        let timer = null;

        function localDoc() {
          const doc = {};
          for (let i = 0; i < localStorage.length; i += 1) {
            const key = localStorage.key(i);
            if (key.startsWith(PREFIX) && key !== FLAG) doc[key] = localStorage.getItem(key);
          }
          return doc;
        }
        function listOf(value) { try { const v = JSON.parse(value || "[]"); return Array.isArray(v) ? v : []; } catch { return []; } }
        // Union of orders by id; `winner` decides which copy is kept when both devices have the same id.
        function merge(server, local, winner) {
          const out = { ...local, ...server };
          if (winner === "local") Object.assign(out, local);
          for (const key of ["hax-orders", "hax-closures", "hax-shipments"]) {
            if (server[key] === undefined && local[key] === undefined) continue;
            const first = listOf(winner === "local" ? local[key] : server[key]);
            const second = listOf(winner === "local" ? server[key] : local[key]);
            const seen = new Set(first.map((item) => item.id ?? JSON.stringify(item)));
            out[key] = JSON.stringify([...first, ...second.filter((item) => !seen.has(item.id ?? JSON.stringify(item)))]);
          }
          return out;
        }
        function applyLocally(doc) {
          for (const key of Object.keys(doc)) nativeSet.call(localStorage, key, doc[key]);
          for (const key of Object.keys(localDoc())) if (!(key in doc)) nativeRemove.call(localStorage, key);
          orders = load().map(withFigures);
          loadExtra();
          render();
          drawCalendar();
        }
        function login() {
          if (document.querySelector("#login-gate")) return;
          const gate = document.createElement("div");
          gate.id = "login-gate";
          gate.style.cssText = "position:fixed;inset:0;background:#fff;z-index:50;display:grid;place-items:center;padding:1.5rem";
          gate.innerHTML = `<form style="width:min(20rem,100%);text-align:center"><p class="note" style="letter-spacing:.2em;font-weight:800;font-size:.8rem">HAXWORKS</p><h1 style="margin:.5rem 0 1rem;font-size:1.6rem">Orders</h1><input type="password" id="login-pass" placeholder="Password" autocomplete="current-password" style="width:100%;box-sizing:border-box" /><button type="submit" style="margin-top:.6rem;width:100%">Open</button><p id="login-err" class="note" style="color:#b3261e;min-height:1.2rem"></p></form>`;
          document.body.appendChild(gate);
          const input = gate.querySelector("#login-pass");
          input.focus();
          gate.querySelector("form").onsubmit = async (event) => {
            event.preventDefault();
            const response = await fetch("/api/orders", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ password: input.value }) }).catch(() => null);
            if (response?.ok) { gate.remove(); start(); }
            else gate.querySelector("#login-err").textContent = response ? "Wrong password." : "No connection.";
          };
        }
        async function start() {
          show("Syncing…");
          const response = await fetch("/api/orders", { cache: "no-store" }).catch(() => null);
          if (!response) { show("Offline — saved on this device only"); return; }
          if (response.status === 401) { show(""); login(); return; }
          const remote = await response.json();
          const firstTime = localStorage.getItem(FLAG) !== "1";
          const local = localDoc();
          const merged = firstTime ? merge(remote.data || {}, local, "server") : (remote.data || {});
          version = remote.version;
          applyLocally(merged);
          nativeSet.call(localStorage, FLAG, "1");
          ready = true;
          if (firstTime && JSON.stringify(merged) !== JSON.stringify(remote.data || {})) await push();
          show("Synced ✓");
        }
        async function push() {
          if (busy) { dirty = true; return; }
          busy = true;
          dirty = false;
          show("Saving…");
          try {
            let response = await fetch("/api/orders", { method: "PUT", headers: { "content-type": "application/json" }, body: JSON.stringify({ data: localDoc(), baseVersion: version }) });
            if (response.status === 409) {
              // Another device saved first: keep both devices' orders (this device wins ties), then save again.
              const theirs = await response.json();
              const merged = merge(theirs.data || {}, localDoc(), "local");
              version = theirs.version;
              applyLocally(merged);
              response = await fetch("/api/orders", { method: "PUT", headers: { "content-type": "application/json" }, body: JSON.stringify({ data: merged, baseVersion: version }) });
            }
            if (response.status === 401) { show(""); login(); return; }
            if (!response.ok) throw new Error("save failed");
            version = (await response.json()).version;
            show("Synced ✓");
          } catch {
            show("Offline — will retry");
            dirty = true;
          } finally {
            busy = false;
            if (dirty) { clearTimeout(timer); timer = setTimeout(() => { timer = null; push(); }, 4000); }
          }
        }
        // Any change to a hax-* value schedules a save.
        Storage.prototype.setItem = function (key, value) {
          nativeSet.call(this, key, value);
          if (this === localStorage && ready && String(key).startsWith(PREFIX) && key !== FLAG) {
            clearTimeout(timer);
            timer = setTimeout(() => { timer = null; push(); }, 500);
          }
        };
        async function pull() {
          if (!ready || busy || dirty || timer || document.querySelector("dialog[open]") || document.hidden) return;
          const response = await fetch("/api/orders", { cache: "no-store" }).catch(() => null);
          if (!response?.ok) return;
          const remote = await response.json();
          if (remote.version === version) return;
          version = remote.version;
          applyLocally(remote.data || {});
          show("Synced ✓");
        }
        setInterval(pull, 15000);
        document.addEventListener("visibilitychange", pull);
        window.addEventListener("online", () => { if (ready) push(); });
        start();
      })();
    </script>
  </body>
</html>
